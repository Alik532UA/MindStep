<!doctype html>
<html lang="uk">

<head>
	<meta charset="utf-8" />
	<title>MindStep</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap&text=0123456789↖↑↗←→↙↓↘"
		rel="stylesheet">
	<link rel="icon" href="%sveltekit.assets%/favicon/favicon-16px.ico" sizes="16x16" />
	<link rel="icon" href="%sveltekit.assets%/favicon/favicon-32px.ico" sizes="32x32" />
	<link rel="icon" href="%sveltekit.assets%/favicon/favicon-48px.ico" sizes="48x48" />
	<link rel="icon" href="%sveltekit.assets%/favicon/favicon-64px.ico" sizes="64x64" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<!-- Посилання на маніфест (Vite PWA генерує його автоматично) -->

	<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

	<!-- Сигнали для мобільних пристроїв та PWA-режиму -->
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="MindStep" />
	<meta name="application-name" content="MindStep" />

	<!-- Іконки для різних платформ -->
	<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon/icon-180.png" sizes="180x180" />
	<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/favicon/icon-192.png" />

	<!-- manifest.json handled by vite-plugin-pwa -->
	%sveltekit.head%
	<style>
		/* Миттєвий темний фон для уникнення білого спалаху */
		html, body {
			background-color: #1a1a1a;
			margin: 0;
			padding: 0;
		}
	</style>
	<script>
		// Миттєве застосування теми ще до ініціалізації Svelte
		(function() {
			try {
				const theme = localStorage.getItem('mindstep_theme') || 'dark';
				const style = localStorage.getItem('mindstep_style') || 'gray';
				document.documentElement.setAttribute('data-theme', theme);
				document.documentElement.setAttribute('data-style', style);
				
				// Якщо тема світла, змінюємо фон body одразу
				if (theme === 'light') {
					document.body.style.backgroundColor = '#f0f2f5';
				}
			} catch (e) {}
		})();
	</script>
</head>

<body data-sveltekit-preload-data="hover" class="preload-theme">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
