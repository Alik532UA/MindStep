<!doctype html>
<html lang="uk">

<head>
	<meta charset="utf-8" />
	<!--
		Static rather than emitted from svelte:head, because +layout.ts sets
		ssr = false: with SSR off nothing from svelte:head reaches the
		prerendered HTML. "MindStep" alone said nothing about what this is, and
		there was no description or link preview data at all. Not localised for
		the same reason — a crawler never runs the client-side i18n.
	-->
	<title>MindStep — стратегічна гра для тренування памʼяті</title>
	<meta
		name="description"
		content="Безкоштовна головоломка для тренування памʼяті та просторового мислення: ходіть ферзем, уникайте пасток або спробуйте гру наосліп. Одиночна гра, гра вдвох та онлайн."
	/>

	<!--
		Основна адреса сторінки. Без неї пошуковик обирає її сам, а обирати є з
		чого: гра відкривається і за адресою з кінцевою косою рискою, і без неї,
		і з параметрами запиту (`?lang=`, посилання з реферерами). Усе це — та
		сама сторінка, але для індексу вони різні, і вага розмазується між ними.

		Адреса статична, бо застосунок односторінковий: усі стани — це стани
		всередині гри, а не окремі документи. `og:url` нижче навмисно той самий.
	-->
	<link rel="canonical" href="https://alik532ua.github.io/MindStep/" />

	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://alik532ua.github.io/MindStep/" />
	<meta property="og:title" content="MindStep — стратегічна гра для тренування памʼяті" />
	<meta
		property="og:description"
		content="Безкоштовна головоломка для тренування памʼяті та просторового мислення: ходіть ферзем, уникайте пасток або спробуйте гру наосліп."
	/>
	<meta property="og:image" content="https://alik532ua.github.io/MindStep/icon-512.png" />

	<meta name="twitter:card" content="summary" />
	<meta name="twitter:title" content="MindStep — стратегічна гра для тренування памʼяті" />
	<meta
		name="twitter:description"
		content="Безкоштовна головоломка для тренування памʼяті та просторового мислення: ходіть ферзем, уникайте пасток або спробуйте гру наосліп."
	/>
	<meta name="twitter:image" content="https://alik532ua.github.io/MindStep/icon-512.png" />

	<!-- Structured Data (SEO-v8 § 3.2) -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "WebApplication",
		"name": "MindStep",
		"url": "https://alik532ua.github.io/MindStep/",
		"description": "Безкоштовна головоломка для тренування памʼяті та просторового мислення: ходіть ферзем, уникайте пасток або спробуйте гру наосліп.",
		"applicationCategory": "GameApplication",
		"operatingSystem": "Any",
		"image": "https://alik532ua.github.io/MindStep/icon-512.png",
		"inLanguage": "uk",
		"author": {
			"@type": "Person",
			"name": "Alik532UA"
		}
	}
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap&text=0123456789↖↑↗←→↙↓↘"
		rel="stylesheet">
	<link rel="icon" href="%sveltekit.assets%/favicon/favicon-16px.ico" sizes="16x16" />
	<link rel="icon" href="%sveltekit.assets%/favicon/favicon-32px.ico" sizes="32x32" />
	<link rel="icon" href="%sveltekit.assets%/favicon/favicon-48px.ico" sizes="48x48" />
	<link rel="icon" href="%sveltekit.assets%/favicon/favicon-64px.ico" sizes="64x64" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<!-- Посилання на маніфест (Vite PWA генерує його автоматично) -->

	<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

	<!-- Сигнали для мобільних пристроїв та PWA-режиму -->
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="MindStep" />
	<meta name="application-name" content="MindStep" />

	<!-- Іконки для різних платформ -->
	<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon/icon-180.png" sizes="180x180" />
	<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/favicon/icon-192.png" />

	<!-- manifest.json handled by vite-plugin-pwa -->
	%sveltekit.head%
	<style>
		/* Миттєвий темний фон для уникнення білого спалаху */
		html, body {
			background-color: #1a1a1a;
			margin: 0;
			padding: 0;
		}

		/*
			Світлий фон — селектором, а не присвоєнням із скрипта нижче.

			Доти тут стояло `document.body.style.backgroundColor = '#f0f2f5'`, і
			воно не виконувалося ЖОДНОГО разу: скрипт лежить у <head>, а поки
			парситься <head>, `document.body` дорівнює null. Присвоєння кидало
			TypeError, і його з'їдав `catch (e) {}` поруч. Симптому при цьому
			майже немає — сторінка малюється правильно, просто зі світлою темою
			перший кадр темний, доки не приїде app.css. Рівно той клас, який
			AI-AGENT-PITFALLS-v8 § 2.1 називає «відсутність симптому не є
			доказом відсутності проблеми».

			Атрибут виставляє той самий скрипт, тож правило спрацьовує на
			першому ж обчисленні стилів — тобто раніше, ніж будь-який JS міг би.
			Значення — перший стоп градієнта `--bg-primary` світлої теми типового
			стилю `gray` (themes/gray.css), тобто рівно той колір, який ляже на
			<body> після app.css. Попереднє `#f0f2f5` не збігалося ні з чим.
		*/
		html[data-theme='light'],
		html[data-theme='light'] body {
			background-color: #f5f6fa;
		}
	</style>
	<script>
		// Миттєве застосування теми ще до ініціалізації Svelte.
		// Фон при цьому НЕ чіпається: <body> тут ще не існує (див. коментар у
		// <style> вище) — за нього відповідає правило `html[data-theme='light']`.
		(function() {
			try {
				const theme = localStorage.getItem('mindstep_theme') || 'dark';
				const style = localStorage.getItem('mindstep_style') || 'gray';
				document.documentElement.setAttribute('data-theme', theme);
				document.documentElement.setAttribute('data-style', style);
			} catch (e) {}
		})();
	</script>
</head>

<body data-sveltekit-preload-data="hover" class="preload-theme">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
