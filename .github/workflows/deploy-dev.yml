# .github/workflows/deploy-dev.yml

name: Deploy Dev to GitHub Pages

on:
  workflow_dispatch:


# Те саме правило, що й у deploy.yml: скасований прогін ховає гейт, який
# жодного разу не виконувався (CI-CD-AND-TOOLS-v8 § 1.3).
concurrency:
  group: "pages-dev"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Ті самі гейти, що в deploy.yml. Доти цей пайплайн складався з
      # `npm ci` + `build` + `deploy` — стан, який CI-CD-AND-TOOLS-v8 § 1.6
      # називає прямо: тести існують, але не виконуються ніколи. Прев'ю
      # існує саме щоб дивитися на зміну ДО продакшну, тож пропускати на
      # ньому перевірки — це перевіряти продакшном.
      #
      # E2E тут навмисно немає: єдиний e2e-файл у CI (`invariants.spec.ts`)
      # потребує браузера й додає до прогону хвилини, а прев'ю запускається
      # руками й часто. Він лишається гейтом `main` — і це записано, а не
      # мовчить (CI-CD-AND-TOOLS-v8 § 1.6).
      - name: Check types
        run: npm run check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # Окремий процес, а не тест: перевірка стежить за маскою `test.include`,
      # і звуження маски викинуло б із прогону її саму разом з усіма `.test.ts`
      # (AI-AGENT-PITFALLS-v9 § 1.3.1, `PIT-TEST-DISCOVERY-PROCESS`).
      - name: Кожен файл перевірки справді запускається
        if: ${{ !cancelled() }}
        run: npm run check:tests

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: npm run test:report

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-dev
          path: test-reports/
          retention-days: 7

      - name: Build
        id: build
        run: npm run build
        env:
          BASE_PATH: "/MindStep/dev"

      - name: Check built output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:build

      - name: Збірка не змінює відстежувані файли
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code

      - name: Deploy to GitHub Pages (dev subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: dev
