# .github/workflows/deploy-dev.yml

name: Deploy Dev to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

# Те саме правило, що й у deploy.yml: скасований прогін ховає гейт, який
# жодного разу не виконувався (CI-CD-AND-TOOLS-v8 § 1.3).
concurrency:
  group: "pages-dev"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Ті самі гейти, що в deploy.yml. Доти цей пайплайн складався з
      # `npm ci` + `build` + `deploy` — стан, який CI-CD-AND-TOOLS-v8 § 1.6
      # називає прямо: тести існують, але не виконуються ніколи. Прев'ю
      # існує саме щоб дивитися на зміну ДО продакшну, тож пропускати на
      # ньому перевірки — це перевіряти продакшном.
      #
      # E2E тут навмисно немає: єдиний e2e-файл у CI (`invariants.spec.ts`)
      # потребує браузера й додає до прогону хвилини, а прев'ю запускається
      # руками й часто. Він лишається гейтом `main` — і це записано, а не
      # мовчить (CI-CD-AND-TOOLS-v8 § 1.6).
      - name: Check types
        run: npm run check

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: npm run test:report

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-dev
          path: test-reports/
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          BASE_PATH: "/MindStep/dev"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Check built output
        run: npm run check:build

      - name: Збірка не змінює відстежувані файли
        run: git diff --exit-code

      - name: Deploy to GitHub Pages (dev subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: dev
