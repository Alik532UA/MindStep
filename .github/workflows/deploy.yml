# .github/workflows/deploy.yml

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:


# `cancel-in-progress: false` — вимога CI-CD-AND-TOOLS-v8 § 1.3 для
# деплой-пайплайна, і не з міркувань акуратності. Пуш пачкою комітів разом із
# `true` скасовує всі проміжні прогони, лишаючи тільки останній: прогін, який
# УПЕРШЕ виконав би щойно доданий гейт, не завершується ніколи. Гейт при цьому
# виглядає робочим — він просто не виконувався жодного разу
# (AI-AGENT-PITFALLS-v8 § 1.4, де цей проєкт названий поіменно).
concurrency:
  group: "pages-main"
  cancel-in-progress: false

jobs:
  # Правила доступу до бази — ЄДИНА межа безпеки онлайн-частини, і єдина частина
  # проєкту, стан якої не видно ні в `src/`, ні у `build/`: вони виконуються на
  # боці Firebase (CLOUD-DATABASE-v8 § 3.4). Решта гейтів проходить однаково і на
  # правильних правилах, і на «дозволити все» — саме тому дірка
  # `allow read, write: if true` прожила в цьому проєкті до аудиту.
  #
  # Окремий джоб, а не крок у деплої: емулятор вимагає Java й не потребує збірки,
  # тож деплой на нього не чекає, а правила перевіряються на кожному пуші.
  #
  # Доти скрипт `check:rules` існував і в CI не викликався — це рівно той
  # різновид хибно-зеленого, коли в PROJECT-CONTEXT.md стоїть «правила
  # перевіряються», і наступний аудит читає це як факт.
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      # Емулятори Firestore і Realtime Database — java-процеси. Без цього кроку
      # `emulators:exec` падає з «java not found», і це виглядає як зламані правила.
      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # 90 випадків, з них 59 «сторонній не мусить цього могти». Правила
      # «дозволити все» валять негативний набір, «заборонити все» — позитивний;
      # скрипт сам падає, якщо один із наборів спорожнів.
      #
      # Числа тут під гейтом `src/doc-numbers.test.ts`: доти в цьому коментарі
      # стояло «31 випадок: 10 і 21» — склад набору, якого давно немає, тобто
      # читач CI бачив третину справжнього (AI-AGENT-PITFALLS § 5.5,
      # `PIT-NUMBER-UNDER-GATE`). У `PROJECT-CONTEXT.md` ті самі числа були
      # правильні саме тому, що там вони під гейтом стояли, а тут ні.
      - name: Перевірка правил доступу
        run: npm run check:rules

  # ПРАВИЛА ВИКЛАДАЮТЬСЯ В БОЙОВУ БАЗУ — і саме цього тут бракувало.
  #
  # Джоб `rules` вище лише ПЕРЕВІРЯЄ їх на емуляторі. Виглядає це як «правила в
  # порядку», але в бойовій базі лишаються ті, які востаннє вставили руками в
  # консолі. `PROJECT-CONTEXT.md` про це й пише: «НЕ звірений після ревізії
  # 2026-08-18… нові звуження там відсутні». Тобто `rooms` із полевим звуженням
  # `update`, входом гостя окремим випадком і append-only журналом ходів лежали
  # у файлі, гейт був зелений, а база приймала старі, ширші правила.
  #
  # Викладається ПЕРЕД збіркою (`build-and-deploy` чекає на цей джоб): нові
  # правила сумісні зі старим кодом, а старі з новим — ні. Зворотний порядок дає
  # вікно, у якому свіжий код уже пише поле, якого правило не дозволяє.
  #
  # Індекси їдуть разом: емулятор індексів не перевіряє взагалі — він виконує
  # будь-який запит, — а Firestore без індексу відмовляє лише в продакшні. Тобто
  # запит, зелений скрізь локально, падає в людей.
  #
  # Потрібен секрет `FIREBASE_SERVICE_ACCOUNT` — JSON сервісного акаунта з
  # ролями «Firebase Rules Admin» і «Firebase Realtime Database Admin». Без
  # нього крок ПРОПУСКАЄТЬСЯ з попередженням, а не валить деплой: сайт має
  # лишатися розгортаним і тому, хто форкнув репозиторій без доступу до бази.
  publish-rules:
    needs: rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    # Секрет читається В ENV, а не в `if` кроку: так умову видно однаково й у
    # форку, де секрету немає зовсім.
    env:
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Ідентифікатор проєкту береться з ТОГО САМОГО секрету, який уже читає
      # збірка, а не з нового. Окремий вимагав би заводити друге джерело для
      # одного факту — і саме так тут ледь не з'явився деплой правил у проєкт
      # «mindstep», якого не існує: справжній називається `stay-on-the-board`.
      FIREBASE_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Дві умови окремо: бракувати може або ключа, або ідентифікатора проєкту,
      # і повідомлення мусить називати саме те, чого бракує.
      - name: Ідентифікатора проєкту немає
        if: ${{ env.FIREBASE_PROJECT == '' }}
        run: |
          echo "::warning title=Правила не викладені::Немає секрету VITE_FIREBASE_PROJECT_ID. Без нього невідомо, у який проєкт викладати."

      - name: Секрета немає — правила лишаються як є
        if: ${{ env.SERVICE_ACCOUNT == '' }}
        run: |
          echo "::warning title=Правила не викладені::Немає секрету FIREBASE_SERVICE_ACCOUNT, тож у базі лишилися старі правила. Вставте свіжі firestore.rules і database.rules.json у Firebase Console руками — інакше звуження, зроблені в репозиторії, у продакшні не діють."

      # КЛЮЧ СЕРВІСНОГО АКАУНТА ЖИВЕ РІВНО ОДИН КРОК.
      #
      # Прибирає його `trap … EXIT`, а не `rm` наприкінці, і різниця тут не
      # стилістична: якщо `deploy` упаде — а падає він саме тоді, коли правила
      # не приймаються, тобто найімовірніше, — рядок із `rm` не виконається
      # взагалі, і файл із ключем долежить на раннері до кінця джоба
      # (CI-CD-AND-TOOLS-v9 § 2, `CI-SECRET-EPHEMERAL`).
      #
      # `umask 077` перед записом: типові права на файл у раннері дають читання
      # всім, а в кроках нижче може виконуватися будь-що.
      - name: Викласти правила й індекси
        if: ${{ env.SERVICE_ACCOUNT != '' && env.FIREBASE_PROJECT != '' }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          (umask 077; printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json")
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15 deploy \
            --only firestore:rules,firestore:indexes,database \
            --project "$FIREBASE_PROJECT" --non-interactive

  build-and-deploy:
    # Правила йдуть ПЕРШИМИ: нові сумісні зі старим кодом, старі з новим — ні.
    # Заразом це робить гейт правил блокувальним — доти деплой не чекав на нього
    # зовсім, тобто збірка з невикладеними звуженнями публікувалася без перешкод.
    needs: publish-rules
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      # Доданий разом із самим eslint: до цього скрипт `lint` був псевдонімом
      # для `check`, тобто перевірки ідіом не було ні локально, ні в CI.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # `--reporter=default` у скрипті — не косметика. Доти стояло лише
      # `--reporter=json --outputFile=…`: увесь результат ішов у файл, а в лог
      # крок друкував дванадцять рядків, що обривались на «exit code 1» без
      # жодної назви впалого тесту. Сам файл нікуди не вивантажувався, тож
      # причина падіння гинула разом із раннером — CI казав «зламано» і не міг
      # сказати, що саме. Артефакт нижче закриває той самий розрив.
      # Окремий процес, а не тест: перевірка стежить за маскою `test.include`,
      # і звуження маски викинуло б із прогону її саму разом з усіма `.test.ts`
      # (AI-AGENT-PITFALLS-v9 § 1.3.1, `PIT-TEST-DISCOVERY-PROCESS`).
      - name: Кожен файл перевірки справді запускається
        if: ${{ !cancelled() }}
        run: npm run check:tests

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: npm run test:report

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: test-reports/
          retention-days: 7

      # Рантайм-інваріант унікальності data-testid (TESTID-AND-NAMING-v8 § 1.9.2).
      # Статична перевірка в юніт-тестах бачить усі testid, але не бачить, що
      # один id відповідає двом елементам у DOM. Саме так тут жили
      # `left-menu-slot-0/1`: слот меню і пункт усередині нього мали один id.
      #
      # Вісім сторінок; `/online` і `/game/*` не входять — вони потребують
      # кімнати й емулятора Firebase, це окремий джоб.
      # Браузери не приходять із npm ci. Кешуються між запусками
      # (CI-CD-AND-TOOLS-v9 § 1.3).
      - name: Cache Playwright browsers
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      # Перелік файлів, а не каталог: `tests/e2e/virtual/` — це десять важких
      # наборів, а `tests/e2e/online/` потребує емулятора Firebase. Перелік
      # явний саме тому — щоб було видно, що саме гейт і покриває; що він
      # повний, тримає інваріант у `src/ci.test.ts`.
      #
      # `a11y.spec.ts` — гейт axe (ACCESSIBILITY-v8 § 10, `GATE-A11Y-AXE`).
      # Доти жодна перевірка проєкту не рахувала контраст, не бачила порядку
      # заголовків і не міряла ARIA на зібраному DOM.
      # `voice-tab.spec.ts` — регресія по дефекту, який відтворювався лише на
      # пристроях Apple (повторний `voiceURI` у `getVoices()` валив вкладку
      # голосу через `each_key_duplicate`). Список підставляється, тож перевірка
      # не залежить від голосів, встановлених на раннері.
      # `touch-targets.spec.ts` — сенсорні цілі парами (ACCESSIBILITY-v9
      # § 10.3.1, `A11Y-TOUCH-OVERLAP`). axe міряє кожну ціль окремо й
      # зелений навіть тоді, коли дві з них лежать одна на одній.
      - name: Runtime invariants (unique data-testid, html lang, axe, voice tab)
        if: ${{ !cancelled() }}
        run: npx playwright test tests/e2e/invariants.spec.ts tests/e2e/html-lang.spec.ts tests/e2e/a11y.spec.ts tests/e2e/voice-tab.spec.ts tests/e2e/reflow.spec.ts tests/e2e/touch-targets.spec.ts tests/e2e/beta-checklist.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # Поріг high, а не moderate: лишилися 7 moderate у транзитивних
      # залежностях firebase-tools і svelte-i18n, де npm пропонує «фікс»
      # відкотом на кілька мажорів назад. Поріг moderate довелося б одразу
      # вимкнути, а вимкнений гейт гірший за відсутній.
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: npm run audit:ci
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # АДРЕСА RTDB — і без неї онлайн ЛАМАЄТЬСЯ МОВЧКИ.
          #
          # SDK, не отримавши `databaseURL`, виводить її з `projectId` і йде на
          # типовий `https://<projectId>-default-rtdb.firebaseio.com` — тобто в
          # американську базу, якої в цього проєкту немає (справжня в
          # `europe-west1.firebasedatabase.app`). Політика безпеки при цьому
          # дозволяє `wss://*.firebasedatabase.app`, але не `*.firebaseio.com`,
          # тож у продакшні присутність і перепідключення просто не працювали, а
          # в консолі лежало «violates the following Content Security Policy».
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}

      # Єдиний гейт, який бачить дефекти, невидимі в `src/`: порожнє тіло
      # сторінки, canonical, `sveltekit-prerender` в адресах і те, що CSP у
      # static-профілі приходить `<meta>`-тегом, а не заголовком, як у dev
      # (SEO-v8 § 6.1, SECURITY-v8 § 16). Саме він знайшов `/about`, який
      # у продакшн-збірці віддавав порожній документ.
      - name: Build
        id: build
        run: npm run build
        env:
          BASE_PATH: "/MindStep"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # АДРЕСА RTDB — і без неї онлайн ЛАМАЄТЬСЯ МОВЧКИ.
          #
          # SDK, не отримавши `databaseURL`, виводить її з `projectId` і йде на
          # типовий `https://<projectId>-default-rtdb.firebaseio.com` — тобто в
          # американську базу, якої в цього проєкту немає (справжня в
          # `europe-west1.firebasedatabase.app`). Політика безпеки при цьому
          # дозволяє `wss://*.firebasedatabase.app`, але не `*.firebaseio.com`,
          # тож у продакшні присутність і перепідключення просто не працювали, а
          # в консолі лежало «violates the following Content Security Policy».
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}

      - name: Check built output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:build

      # CI-CD-AND-TOOLS-v8 § 1.5 — єдина машинна перевірка правила «артефакт
      # збірки не комітиться». Стала можливою лише після того, як
      # `generate-version.js` перестав дописувати `buildTime` у відстежуваний
      # `static/version.json`: доти цей крок падав би на кожному прогоні.
      #
      # Крок стоїть у `ci.yml` і `deploy-dev.yml`, а тут його НЕ БУЛО: лишався
      # тільки цей коментар, приліплений до наступного кроку. Тобто пайплайн,
      # що викладає в продакшн, читався як покритий і не перевіряв нічого.
      # Інваріант `src/ci.test.ts` тепер тримає пару «є `npm run build` — є цей
      # крок», щоб він не зник удруге.
      - name: Збірка не змінює відстежувані файли
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code

      - name: Lighthouse Audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      # Preserve dev/ from current gh-pages
      - name: Preserve dev folder
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git show gh-pages:dev/ >/dev/null 2>&1; then
            git archive gh-pages -- dev/ | tar -x -C build/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
