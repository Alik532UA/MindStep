# .github/workflows/deploy.yml

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-main"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check types
        run: npm run check

      # Доданий разом із самим eslint: до цього скрипт `lint` був псевдонімом
      # для `check`, тобто перевірки ідіом не було ні локально, ні в CI.
      - name: Lint
        run: npm run lint

      # `--reporter=default` у скрипті — не косметика. Доти стояло лише
      # `--reporter=json --outputFile=…`: увесь результат ішов у файл, а в лог
      # крок друкував дванадцять рядків, що обривались на «exit code 1» без
      # жодної назви впалого тесту. Сам файл нікуди не вивантажувався, тож
      # причина падіння гинула разом із раннером — CI казав «зламано» і не міг
      # сказати, що саме. Артефакт нижче закриває той самий розрив.
      - name: Run unit tests
        run: npm run test:report

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-reports/
          retention-days: 7

      # Рантайм-інваріант унікальності data-testid (TESTID-AND-NAMING-v8 § 1.9.2).
      # Статична перевірка в юніт-тестах бачить усі testid, але не бачить, що
      # один id відповідає двом елементам у DOM. Саме так тут жили
      # `left-menu-slot-0/1`: слот меню і пункт усередині нього мали один id.
      #
      # Вісім сторінок; `/online` і `/game/*` не входять — вони потребують
      # кімнати й емулятора Firebase, це окремий джоб.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Unique data-testid invariant
        run: npx playwright test tests/e2e/invariants.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Поріг high, а не moderate: лишилися 7 moderate у транзитивних
      # залежностях firebase-tools і svelte-i18n, де npm пропонує «фікс»
      # відкотом на кілька мажорів назад. Поріг moderate довелося б одразу
      # вимкнути, а вимкнений гейт гірший за відсутній.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Build
        run: npm run build
        env:
          BASE_PATH: "/MindStep"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      # Preserve dev/ from current gh-pages
      - name: Preserve dev folder
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git show gh-pages:dev/ >/dev/null 2>&1; then
            git archive gh-pages -- dev/ | tar -x -C build/
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
